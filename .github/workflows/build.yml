name: Build Honor Mod
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Unzip project
        run: unzip -q honor-mod-source.zip
      - name: Build
        working-directory: honor-mod
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: honor-mod-jar
          path: honor-mod/build/libs/*.jar
